name: Validate & Test

on:
  push:
    branches:
      - main
      - emdash/*
  pull_request:

jobs:
  validate-hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    if: "!github.event.repository.private"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration
          # Repository description and topics are GitHub settings, not files.
          # Remove this once both are set on the repository page (About → ⚙).
          ignore: "description topics"
          comment: false

  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml
