name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, must match manifest.json version (e.g. v1.4.0 or v1.4.0-rc1)'
        required: true
        type: string
        default: 'v1.4.0'
      prerelease:
        description: 'Mark as pre-release (tags with a suffix such as -rc1 are always pre-releases)'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  release:
    name: Build & Publish Release
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: vars
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          VERSION="$(python3 -c 'import json; print(json.load(open("custom_components/meross_cloud/manifest.json"))["version"])')"
          case "${TAG#v}" in
            "${VERSION}"|"${VERSION}"-*|"${VERSION}"rc*|"${VERSION}"b*|"${VERSION}"a*) ;;
            *)
              echo "::error::Tag '${TAG}' does not match manifest.json version '${VERSION}'"
              exit 1
              ;;
          esac

          PRERELEASE="${INPUT_PRERELEASE:-false}"
          # Anything after the manifest version (-rc1, b2, ...) marks a release candidate
          if [ "${TAG#v}" != "${VERSION}" ]; then
            PRERELEASE=true
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG} (manifest version ${VERSION}, prerelease=${PRERELEASE})"

      - name: Create or update Git tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.vars.outputs.tag }}"
          git push -f origin "${{ steps.vars.outputs.tag }}"

      - name: Package custom_components for HACS
        run: |
          cd custom_components
          zip -r ../meross_cloud.zip meross_cloud -x '*/__pycache__/*' '*.pyc'
          cd ..
          unzip -l meross_cloud.zip | tail -1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          files: meross_cloud.zip
          prerelease: ${{ steps.vars.outputs.prerelease }}
          generate_release_notes: true
