name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (z.B. v1.4.0)'
        required: true
        type: string
        default: 'v1.4.0'
      prerelease:
        description: 'Mark as Pre-release'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build, Test & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies & run test suite
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp "paho-mqtt>=2.1.0" "pycryptodomex>=3.20.0" voluptuous requests pytest pytest-asyncio
          pytest tests/

      - name: Determine release tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create or update Git Tag (if manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f ${{ steps.vars.outputs.tag }}
          git push -f origin ${{ steps.vars.outputs.tag }}

      - name: Package custom_components for HACS
        run: |
          cd custom_components
          zip -r ../meross_cloud.zip meross_cloud
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          files: meross_cloud.zip
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
